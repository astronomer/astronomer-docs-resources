# This file contains non-secret configurations.

platformReleasesFile: 'astronomer_platform_releases.json'

# API webserver configuration.
webserver:
  port: 8871
  endpoint: "/v1"
  subscriptions: "/ws"
  client: "/playground"
  graphqlPlayground:
    enabled: true


# CORS Access
cors:
  allowedOrigins: []

# Prisma configuration.
prisma:
  endpoint: "http://localhost:4466/houston"
  subscriptionEndpoint: "ws://houston.local.astronomer.io:8871"
  secret: ~
  debug: false
  trgmSimilarityIndex: 0.1

# NATS configuration.
nats:
  servers: ["nats://localhost:4222"]
  clusterID: houston
  ackWait: 300000
  timeout: 3000
  maxReconnectAttempts: 200
  maxPingOut: 20
  pingInterval: 5000
  reconnect: true
  reconnectTimeWait: 5000
  reconnectJitter: 150
  reconnectJitterTLS: 1000
  waitOnFirstConnect: true
  tls:
    enabled: false
    keyFile: certs/client-tls.key
    certFile: certs/client-tls.crt
    caFile: certs/tls.pem
workers:
  deleteDeploymentConfig:
    retryCount: 5
  updateDeploymentConfig:
    retryCount: 5
  deploymentRefreshTaskUsage:
    retryCount: 5
  deploymentCleanupAirflowDb:
    retryCount: 5
  dplink:
    debug:
      enabled: false
    claimIntervalSeconds: 30
    leaseRenewalIntervalSeconds: 15
    leaseDurationSeconds: 60
    unreachableThresholdSeconds: 90
    degradedThresholdSeconds: 30
    reconnectMaxAttempts: 10
    initialReconnectDelaySeconds: 1
    maxReconnectDelaySeconds: 30
    reconnectDelayMultiplier: 2
    jitterFraction: 0.2
  dispatcher:
    enabled: false
    dispatchLeaseTtlSeconds: 30
    dispatchBatchSize: 50
    dispatchMaxInflight: 50
    dispatchMaxInflightPerDp: 5
    dispatchPollSeconds: 10
    dispatchMaxAttemptsPerLease: 5
    dispatchMaxAttemptsPerFlight: 25
    dispatchRetryCooloffPeriod: 60
    specVersion: "v1"
    inRegionStartFlightRpcTimeoutMs: 5000
    crossRegionStartFlightRpcTimeoutMs: 12000
    circuitBreaker:
      failureThreshold: 10
      cooloffSeconds: 30
      probeMaxInflight: 1
  navigator:
    enabled: false
    failoverRequestReconcilerIntervalSeconds: 10
    deploymentAdmitForInProgressMissionsIntervalSeconds: 10
    deploymentAdmitForPendingCleanupMissionsIntervalSeconds: 30
    deploymentClaimBatchSize: 50
    deploymentAdmitBatchSize: 5
    missionClaimMinBatchSize: 10
    missionPlanBatchSize: 5
    missionReconcileBatchSize: 5
    claimIntervalSeconds: 10
    claimFraction: 0.5
    cleanupIntervalSeconds: 300
    missionCleanupTtl: 604800
    flightCleanupTtl: 604800

# Logging configuration.
logging:
  level: "info"

# Database connection.
# Database configuration
# Note: Knex has been removed - we now use Prisma exclusively for database operations
# The connection config is kept for backward compatibility and may be used by other services
database:
  provider: postgres
  schema: houston$default
  # this is for enabling ssl connection for database
  ssl: false

  # Database connection (may be used by other services)
  connection:
    user: postgres
    password: postgres
    host: localhost
    port: 5432
    database: postgres

# Houston service in cluster
houston:
  host: localhost

strictSchemaCheck:
  enabled: true

# Commander configuration.
commander:
  enabled: false
  host: localhost
  port: 50051
  httpPort: 8880

# Docker Registry configuration.
registry:
  version: 3
  host: localhost
  port: 5000
  authHeader: ~
  protectedCustomRegistry:
    enabled: false
    baseRegistry:
      enabled: false
      host: localhost
      user: ~
      email: ~
      pass: ~
      secretName: ~
      secretSourcedFromHelm: true
    updateRegistry:
      enabled: false
      host: localhost
      user: ~
      email: ~
      pass: ~
      secretName: ~
      secretSourcedFromHelm: true

# Email configuration.
email:
  # Enable sending emails.
  enabled: false

  # Open HTML emails in browser when sent.
  preview: false

  # The "from" address to use.
  reply: "noreply@astronomer.io"

  # The SMTP server URL.
  smtpUrl: ~
  smtp:
    enabled: false
    host: ~
    port: ~
    secure: true
    auth:
      user: ~
      pass: ~
    tls:
      rejectUnauthorized: true

# Apollo schema reporting configuration
apollo:
  schema:
    reporting: false
  key: ~
  graphVariant: ~
  # whether or not introspection apis are available via graphql
  introspection: true
  # enable/disable GraphQL audit middleware plugin
  auditMiddleware:
    enabled: true

# UI configuration.
ui:
  subdomain: app
  port: 5000
  externalUrls:
    documentation:
      base: https://www.astronomer.io/docs/astro-private-cloud
      cliInstallWindows10: https://www.astronomer.io/docs/astro/cli/install-cli
      cliQuickstart: https://www.astronomer.io/docs/astro/cli/install-cli
      deployCli: https://www.astronomer.io/docs/software/deploy-cli/
      configureDeployment: https://www.astronomer.io/docs/astro-private-cloud/configure-deployment
      ciCd: https://www.astronomer.io/docs/astro-private-cloud/ci-cd
      manageWorkspaces: https://www.astronomer.io/docs/astro-private-cloud/manage-workspaces
      deployDags: https://www.astronomer.io/docs/astro-private-cloud/deploy-dags
      deployRollbacks: https://www.astronomer.io/docs/astro-private-cloud/deploy-rollbacks
      privacyPolicy: https://www.astronomer.io/privacy/
      terms: https://www.astronomer.io/terms/
      support: https://support.astronomer.io/
      guides: https://www.astronomer.io/guides/
    statusPage: ~

# Elasticsearch configuration for Houston to pull logs.
# This is passed straight to the es client.
elasticsearch:
  # Enable or disable querying for logs in ES. This supersedes mock configuration below.
  enabled: false

  # Client configuration, passed directly to es-client constructor.
  client:
    node: ~
    log: error

  # If in NODE_ENV is development and this is enabled, generate sample log records.
  mockInDevelopment: true

  # Interval that data is grabbed and sent
  pollInterval: 1000

# Prometheus Metrics configuration
prometheus:
  # Sample data - false for no querying prometheus, true for querying prometheus.
  enabled: false
  cadvisor:
    enabled: false
  host: localhost
  port: 9090
  pollInterval: 30000
  statusPollInterval: 60000

# Charts live here.
# This is where the airflow chart is installed from.
repository: "https://helm.astronomer.io/"

plane:
  mode: unified

# Helm configuration.
# These values are set at runtime and used for airflow deployments.
helm:
  baseDomain: ~
  registryAuthSecret: ~
  releaseName: ~
  releaseNamespace: ~
  releaseVersion: ~
  singleNamespace: false
  tlsSecretName: astronomer-tls

allowedSystemLevelDomains: []
  # - astronomer.io
  # - gmail.com

# Auth configuration.
auth:
  # Local database (user/pass) configuration.
  local:
    enabled: false
    teams:
      enabled: false

  openidConnect:
    insecureIDPTokenLog:
      enabled: false
    teamFilterRegex: ""
    # flow option is needed until we EOL implicit (valid values "code" and "implicit")
    flow: "implicit"
    # import and reconcile groups from OpenID Connect
    idpGroupsImport:
      enabled: false
    manageSystemPermissionsViaIdpGroups:
      enabled: false
      systemAdmin: []
      systemEditor: []
      systemViewer: []
    # Set the JWT expiry = Minimum of Access Token expiry and jwt.authDuration
    # import and reconcile groups from OpenID Connect whenever JWT is expired and then issue a new JWT
    idpGroupsRefresh:
      enabled: false
    # interval (in miuntes) when reconciler runs
    idpGroupReconcilerInterval: 60
    clockTolerance: 0
    # Auth0 integration configuration.
    auth0:
      # This "enabled" flag is currently a little misleading.
      # The enabled flag refers only to showing the native
      # Auth0 button in the UI. The rest of the settings here
      # could potentially be used as to auth with Google/Github/etc
      # if those integrations are enabled, but do not have connection
      # information.
      enabled: false
      clientId: ~
      discoveryUrl: https://astronomerio.auth0.com
      authUrlParams:
        audience: "astronomer-ee"

    # Google oauth configuration.
    google:
      displayName: Google
      enabled: false
      # If blank we will go via Auth0
      clientId: ~
      discoveryUrl: https://accounts.google.com

    okta:
      enabled: false
      scimAuthCode: ~
      clientId: ~
      discoveryUrl: ~

    custom:
      displayName: "Custom oAuth"
      enabled: false
      # If blank we will go via Auth0
      clientId: ~
      discoveryUrl: ~

    microsoft:
      displayName: "Azure AD"
      scimAuthCode: ~
      enabled: false
      claimsMapping:
        email: preferred_username
      clientId: ~
      discoveryUrl: ~
      useExternalProxy: true

    adfs:
      displayName: "ADFS"
      enabled: false
      # Disable userInfo request for providers such as ADFS
      fetchUserInfo: false
      claimsMapping:
        email: upn
        name: upn
      clientId: ~
      discoveryUrl: ~

    masqueraders:
      uri: ~
      providerName: ~
      method: "GET"
      claimsMapping:
        email: ~

  # Github via auth0
  github:
    enabled: false

# Houston JWT configuration.
jwt:
  enabledSecondaryFlowsForAuthentication:
    - jwtCreationViaIDPToken
  testJWT:
    enabled: false
    okta:
      username: ~
      password: ~
      codeChallenge: ~
      verifier: ~
  # Development only: Passphrase to sign JWTs used to authenticate our GraphQL
  # API.
  #passphrase: ~

  # Duration in milliseconds after user has to be logged out, irrespective of current JWT's expiry status.
  authDuration: 86400000

  # Path to folder containing tls.crt and tls.key, used for signing JWT tokens
  # to authenticate against the Docker registry and Airflow FAB UI
  certPath: ~

  # Docker registry configuration.
  registry:
    certPath: ~
    issuer: ~
    service: ~
    # A list of "base" images in the repository that every user will be able to
    # pull/remount to share base layers. Pushable by SYSTEM_ADMIN and
    # SYSTEM_EDITOR
    baseImages:
      - base-images/airflow
# User management config if disabled only service accounts and users associated to groups can use astro
userManagement:
  enabled: true
# Service Account configuration.
serviceAccounts:
  enabled: true
  # When a new service account is created, return the full apiKey for
  # this many minutes. After this amount of time, return a partially obfuscated version.
  showFor: 10

  # Display this many characters of the real apiKey after showFor has been exceeded.
  showFirstChars: 6

# Allow public signups.
publicSignups:
  enabled: false

# URL to send users to for signup when publicSignups.enabled is disabled
externalSignupUrl: ~

# Require email confirmation.
emailConfirmation:
  enabled: true

# Subdomain under base domain.
subdomain: houston

# Subdomain using https.
subdomainHttps:
  enabled: true

# ui app name
appSubName: "Astro Private Cloud"

# Format: ${SCOPE}.${RESOURCE}.${VERB}
roles:
  # To explicitly remove a permission defined in this base config set it to false in your local config
  # roles:
  #   SYSTEM_VIEWER:
  #     permissions:
  #       system.monitoring.get: false

  #
  # Workspace Roles
  #
  WORKSPACE_VIEWER:
    name: Workspace Viewer
    permissions: &PERMS__WORKSPACE_VIEWER
      ? workspace.config.get
      ? workspace.deployments.config.get
      ? workspace.deployments.get
      ? workspace.serviceAccounts.get
      ? workspace.users.get
      ? workspace.teams.get
      ? workspace.taskUsage.get

  WORKSPACE_EDITOR:
    name: Workspace Editor
    permissions: &PERMS__WORKSPACE_EDITOR
      <<: *PERMS__WORKSPACE_VIEWER
      ? workspace.config.update
      ? workspace.deployments.config.update
      ? workspace.deployments.create
      ? workspace.deployments.upsert
      ? workspace.serviceAccounts.create
      ? workspace.serviceAccounts.update
      ? workspace.serviceAccounts.delete
      ? workspace.adminCount.get

  WORKSPACE_ADMIN:
    name: Workspace Admin
    permissions: &PERMS__WORKSPACE_ADMIN
      <<: *PERMS__WORKSPACE_EDITOR
      ? workspace.invites.get
      ? workspace.config.delete
      ? workspace.deployments.config.delete
      ? workspace.iam.update
      ? workspace.teams.getAll
      ? workspace.users.getAll

  #
  # Cluster Roles
  #
  CLUSTER_ADMIN:
    name: Cluster Admin
    permissions: &PERMS__CLUSTER_ADMIN
      ? cluster.config.update
      ? cluster.config.get
      ? cluster.config.create
      ? cluster.config.delete

  #
  # Deployment Roles
  #
  DEPLOYMENT_VIEWER:
    name: Deployment Viewer
    permissions: &PERMS__DEPLOYMENT_VIEWER
      ? deployment.airflow.get
      ? deployment.config.get
      ? deployment.logs.get
      ? deployment.images.pull
      ? deployment.metrics.get
      ? deployment.serviceAccounts.get
      ? deployment.variables.get
      ? deployment.users.get
      ? deployment.teams.get
      ? deployment.taskUsage.get
      ? deployment.status.get
      ? deployment.deployRevisions.get

  DEPLOYMENT_EDITOR:
    name: Deployment Editor
    permissions: &PERMS__DEPLOYMENT_EDITOR
      <<: *PERMS__DEPLOYMENT_VIEWER
      ? deployment.airflow.user
      ? deployment.config.update
      ? deployment.deployments.config.update
      ? deployment.images.push
      ? deployment.dags.push
      ? deployment.serviceAccounts.create
      ? deployment.serviceAccounts.update
      ? deployment.serviceAccounts.delete
      ? deployment.variables.update
      ? deployment.config.upsert
      ? deployment.adminCount.get

  DEPLOYMENT_ADMIN:
    name: Deployment Admin
    permissions: &PERMS__DEPLOYMENT_ADMIN
      <<: *PERMS__DEPLOYMENT_EDITOR
      ? deployment.airflow.admin
      ? deployment.config.delete
      ? deployment.deployments.config.delete
      ? deployment.userRoles.update
      ? deployment.teamRoles.update

    #
  # System Roles
  #
  SYSTEM_VIEWER:
    name: System Viewer
    permissions: &PERMS__SYSTEM_VIEWER
      <<: [*PERMS__WORKSPACE_VIEWER, *PERMS__DEPLOYMENT_VIEWER]
      ? system.airflow.get
      ? system.deployment.variables.get
      ? system.deployments.get
      ? system.invite.get
      ? system.monitoring.get
      ? system.serviceAccounts.get
      ? system.updates.get
      ? system.users.get
      ? system.teams.get
      ? system.workspace.get
      ? system.airflow.viewer
      ? system.taskUsage.get
      ? system.deployments.logs
      ? system.deployments.metrics
      ? system.deployments.status
      ? system.deployRevisions.get
      ? system.workspace.deployments.config.get

  SYSTEM_EDITOR:
    name: System Editor
    permissions: &PERMS__SYSTEM_EDITOR
      <<: [*PERMS__SYSTEM_VIEWER, *PERMS__WORKSPACE_EDITOR, *PERMS__DEPLOYMENT_EDITOR]
      ? system.deployment.variables.update
      ? system.serviceAccounts.update
      ? system.airflow.user
      ? system.registryBaseImages.push
      ? system.adminCount.get
      ? system.workspace.deployments.config.update
      ? system.deployment.deployments.config.update

  SYSTEM_ADMIN:
    name: System Admin
    permissions:
      <<: [*PERMS__SYSTEM_EDITOR, *PERMS__WORKSPACE_ADMIN, *PERMS__DEPLOYMENT_ADMIN]
      ? system.iam.update
      ? system.deployments.create
      ? system.deployments.upsert
      ? system.deployments.update
      ? system.deployments.delete
      ? system.invites.get
      ? system.serviceAccounts.create
      ? system.serviceAccounts.update
      ? system.serviceAccounts.delete
      ? system.user.invite
      ? system.user.delete
      ? system.user.forceDelete
      ? system.user.verifyEmail
      ? system.workspace.delete
      ? system.airflow.admin
      ? system.deployments.images.push
      ? system.deployments.dags.push
      ? system.workspace.update
      ? system.teams.remove
      ? system.teams.create
      ? system.teams.update
      ? system.cleanupAirflowDb.delete
      ? system.cleanupDeployRevisions.delete
      ? system.clusters.register
      ? system.clusters.deregister
      ? system.clusters.update
      ? system.clusters.get
      ? system.workspace.deployments.config.delete
      ? system.deployment.deployments.config.delete

  #
  # User Role (Everyone)
  #
  USER:
    name: User
    permissions:
      ? system.workspace.create
      ? system.getEmailById
      ? system.getDeploymentById

#
# Airflow Deployment Configurations
#
clusters:
  audit:
    retentionDays: 90

deployments:
  # Airflow chart settings
  chart:
    # This version number controls the default Airflow chart version that will be installed
    # when creating a new deployment in the system. This is also used to ensure all
    # child airflow deployments are kept up to date and on the latest version.
    version: 0.0.0

  # releaseVerification determines what docker images are allowed to be installed
  # STABLE = only official Astronomer Core releases that mirror Airflow releaseVersion
  # EDGE   = also allow Astronomer Core Edge (astronomer/core:edge) to be used
  # DEV    = also allow hand-built dev images to be used
  releaseVerification: STABLE

  subdomain: 'deployments'

  # deployments.performanceOptimizationModeEnabled → deployments.performanceOptimization.enabled
  performanceOptimization:
    enabled: false

  upsertDeployment:
    # deployments.upsertExtraIniAllowed → deployments.upsertDeployment.extraIniAllowed
    extraIniAllowed: true  # Gates accepting pgbouncerConfig.extraIni* via upsertDeployment mutation
    # deployments.canUpsertDeploymentFromUI → deployments.upsertDeployment.allowFromUi.enabled
    allowFromUi:
      enabled: true

  # deployments.logHelmValues → deployments.logHelmValues.enabled
  # Operational flag for debugging - logs generated Helm values to console
  logHelmValues:
    enabled: false

  # Deployment tag prefix for docker images
  tagPrefix: "deploy"

  # Fluentd log index prefix
  fluentdIndexPrefix: "fluentd"

  # ========================================
  # RUNTIME & VERSION MANAGEMENT
  # ========================================
  runtimeManagement:
    # deployments.airflowV3 → deployments.runtimeManagement.airflowV3
    airflowV3:
      enabled: false
      minimumAstroRuntimeVersion: "3.1-2"

    # deployments.customImageShaEnabled → deployments.runtimeManagement.customImageSha.enabled
    customImageSha:
      enabled: false

    # deployments.enableListAllRuntimeVersions → deployments.runtimeManagement.listAllRuntimeVersions.enabled
    listAllRuntimeVersions:
      enabled: false

    # Semver constraint for runtime environment overrides
    # deployments.runtimeEnvOverrideSemverCheck → deployments.runtimeManagement.runtimeEnvOverrideSemverCheck
    runtimeEnvOverrideSemverCheck: '>=4.2.8 <5.0.0 || >=5.0.11 <6.0.0 || >= 6.0.5'

    # deployments.astroRuntimeReleasesFile → deployments.runtimeManagement.astroRuntimeReleasesFile
    astroRuntimeReleasesFile: 'astro_runtime_releases.json'

    # deployments.airflowMinimumAstroRuntimeVersion → deployments.runtimeManagement.airflowMinimumAstroRuntimeVersion
    airflowMinimumAstroRuntimeVersion: 2.2.5

  # ========================================
  # LOGGING & OBSERVABILITY
  # ========================================
  logging:
    # deployments.loggingSidecar → deployments.logging.loggingSidecar
    loggingSidecar:
      enabled: false
      name: sidecar-log-consumer
      image: quay.io/astronomer/ap-vector:0.47.0-5
      customConfig: false
      extraEnv: []
      indexPattern: '%Y.%m.%d'
      indexNamePrefix: vector
      securityContext: {}
      livenessProbe: {}
      readinessProbe: {}
      resources:
        limits:
          memory: 384Mi
          cpu: 100m
        requests:
          memory: 384Mi
          cpu: 100m

    # deployments.elasticsearch → deployments.logging.elasticsearch
    elasticsearch:
      enabled: false
      connection:
        host: localhost
        port: 9200

  # ========================================
  # DAG ONLY DEPLOYMENT
  # ========================================
  dagDeploy:
    enabled: false
    images:
      dagServer:
        repository: quay.io/astronomer/ap-dag-deploy
        tag: 0.7.2
        imagePullPolicy: IfNotPresent
    server:
      resources:
        limits:
          memory: 384Mi
          cpu: 100m
        requests:
          memory: 384Mi
          cpu: 100m
      nodeSelector: {}
      affinity: {}
      tolerations: []
    client:
      resources:
        limits:
          memory: 384Mi
          cpu: 200m
        requests:
          memory: 384Mi
          cpu: 200m
      livenessProbe: {}
      readinessProbe: {}
    securityContexts:
      pod: {}
      container: {}
    persistence: {}
    livenessProbe: {}
    readinessProbe: {}
    serviceAccount:
      create: true

  # ========================================
  # DAG DEPLOYMENT MECHANISMS
  # ========================================
  deployMechanisms:
    # deployments.configureDagDeployment → deployments.deployMechanisms.configureDagDeployment.enabled
    configureDagDeployment:
      enabled: false

    # deployments.dagOnlyDeployment → deployments.deployMechanisms.dagOnlyDeployment.enabled
    dagOnlyDeployment:
      enabled: false

    # deployments.nfsMountDagDeployment → deployments.deployMechanisms.nfsMountDagDeployment.enabled
    nfsMountDagDeployment:
      enabled: false

    # deployments.gitSyncDagDeployment → deployments.deployMechanisms.gitSyncDagDeployment.enabled
    gitSyncDagDeployment:
      enabled: false

    # deployments.gitSyncRelay → deployments.deployMechanisms.gitSyncRelay
    gitSyncRelay:
      storageClassName: ~
      webhookSecretKey:
        showForMinutes: 1

  # ========================================
  # AIRFLOW COMPONENTS
  # ========================================
  airflowComponents:
    # deployments.triggererEnabled → deployments.airflowComponents.triggerer.enabled
    triggerer:
      enabled: true

    # deployments.dagProcessorEnabled → deployments.airflowComponents.dagProcessor.enabled
    dagProcessor:
      enabled: true

  # ========================================
  # AUTHENTICATION & SECURITY
  # ========================================
  authSideCar:
    enabled: false
    repository: quay.io/astronomer/ap-auth-sidecar
    tag: 1.29.2
    pullPolicy: IfNotPresent
    port: 8084
    ingressAllowedNamespaces: []
    annotations: {}
    securityContext: {}
    livenessProbe: {}
    readinessProbe: {}
    resources:
      limits:
        memory: 384Mi
        cpu: 100m
      requests:
        memory: 384Mi
        cpu: 100m

  # ========================================
  # RESOURCE MANAGEMENT
  # ========================================
  resourceManagement:
    # deployments.disableManageResourceQuotasAndLimitRanges → deployments.resourceManagement.resourceQuotas
    resourceQuotas:
      enabled: true  # If false, disables management of ResourceQuotas and LimitRanges

    # deployments.components → deployments.resourceManagement.components
    # Allows users to override default component values found in defaultComponents in /src/lib/constants/index.js
    # deployment resource requests, as well as its limits and minimums.
    components: []

    # deployments.executors → deployments.resourceManagement.executors
    # Which executors are supported and components required per executor configuration.
    executors:
    - name: LocalExecutor
      enabled: true
      components:
        - scheduler
        - webserver
        - apiServer
        - statsd
        - pgbouncer
        - triggerer
        - dagProcessor
      defaultExtraCapacity:
        cpu: 0
        memory: 0
    - name: CeleryExecutor
      enabled: true
      components:
        - scheduler
        - webserver
        - apiServer
        - statsd
        - pgbouncer
        - workers
        - flower
        - redis
        - triggerer
        - dagProcessor
      defaultExtraCapacity:
        cpu: 0
        memory: 0
    - name: KubernetesExecutor
      enabled: true
      components:
        - scheduler
        - webserver
        - apiServer
        - statsd
        - pgbouncer
        - triggerer
        - dagProcessor
      defaultExtraCapacity:
        cpu: 1000
        memory: 3840
      workers:
        ephemeralStorage:
          disabled: true
        resources:
          enabled: true

    # deployments.astroUnit → deployments.resourceManagement.astroUnit
    # An astro unit defines the smallest billable unit in the system.
    astroUnit:
      cpu: 100          # millicpu
      memory: 384       # MiB
      pods: 1
      airflowConns: 5
      actualConns: 0.5
      price: 0

    # deployments.maxExtraCapacity → deployments.resourceManagement.maxExtraCapacity
    maxExtraCapacity:
      cpu: 40000
      memory: 153600

    # deployments.maxPodCapacity → deployments.resourceManagement.maxPodCapacity
    maxPodCapacity:
      cpu: 3500
      memory: 13440

    # deployments.sidecars → deployments.resourceManagement.sidecars
    sidecars:
      cpu: 50
      memory: 200

    # deployments.overProvisioningFactorMem / overProvisioningFactorCPU / overProvisioningComponents → deployments.resourceManagement.*
    overProvisioningFactorMem: 1
    overProvisioningFactorCPU: 1
    overProvisioningComponents:
      - scheduler
      - webserver
      - workers
      - triggerer
      - flower
      - pgbouncer
      - statsd
      - dagProcessor

  # ========================================
  # NAMESPACE MANAGEMENT
  # ========================================
  namespaceManagement:
    # deployments.manualReleaseNames → deployments.namespaceManagement.manualReleaseNames.enabled
    manualReleaseNames:
      enabled: false

    # deployments.manualNamespaceNames → deployments.namespaceManagement.manualNamespaceNames.enabled
    manualNamespaceNames:
      enabled: false

    # deployments.namespaceFreeFormEntry → deployments.namespaceManagement.namespaceFreeFormEntry.enabled
    namespaceFreeFormEntry:
      enabled: false
      preDeploymentValidationHook: ~
      preDeploymentValidationHookTimeout: 30000

    # deployments.namespaceLabels → deployments.namespaceManagement.namespaceLabels
    namespaceLabels: {}

    # deployments.preCreatedNamespaces → deployments.namespaceManagement.preCreatedNamespaces
    preCreatedNamespaces: []
    # - name: test1
    # - name: test2

  # ========================================
  # DEPLOYMENT LIFECYCLE
  # ========================================
  deploymentLifecycle:
    # deployments.deployRollback → deployments.deploymentLifecycle.deployRollback.enabled
    deployRollback:
      enabled: false
      deployRevisionReportNumberOfDays: 90
      dagTarballVersionValidation:
        enabled: true

    # deployments.hardDeleteDeployment → deployments.deploymentLifecycle.hardDeleteDeployment.enabled
    hardDeleteDeployment:
      enabled: false

    # deployments.cleanupAirflowDb → deployments.deploymentLifecycle.cleanupAirflowDb.enabled
    cleanupAirflowDb:
      enabled: false
      resources:
        requests:
          cpu: 200m
          memory: 768Mi
        limits:
          cpu: 200m
          memory: 768Mi
      extraEnv: []

  # ========================================
  # DATABASE MANAGEMENT
  # ========================================
  databaseManagement:
    # deployments.database → deployments.databaseManagement.database
    database:
      # If disabled, skip db creation.
      enabled: true
      # Keep the airflow databases around after a deployment is deleted.
      retainOnDelete: false
      # If true, leave GRANTs in place for root user.
      # This lets users log in with the root creds and query deployment databases.
      allowRootAccess: false
      # Connection details for root user.
      # This can also be overridden with a connection string.
      connection:
        user: postgres
        password: postgres
        host: localhost
        port: 5432
        database: postgres
      passwordPolicy:
        length: 32
        minUppercase: 2
        minLowercase: 2
        minNumbers: 2
        minSpecial: 2
        specialChars: "!-_.~"

    # deployments.manualConnectionStrings → deployments.databaseManagement.manualConnectionStrings.enabled
    manualConnectionStrings:
      enabled: false

    # deployments.pgBouncerResourceCalculationStrategy → deployments.databaseManagement.pgBouncerResourceCalculationStrategy
    # Strategy for calculating PgBouncer resources (null = use default algorithm)
    pgBouncerResourceCalculationStrategy: ~

  # ========================================
  # DEPLOYMENT IMAGES & REGISTRY
  # ========================================
  deploymentImagesRegistry:
    # deployments.exposeDockerWebhookEndpoint → deployments.deploymentImagesRegistry.exposeDockerWebhookEndpoint.enabled
    exposeDockerWebhookEndpoint:
      enabled: true

    # deployments.enableUpdateDeploymentImageEndpoint → deployments.deploymentImagesRegistry.updateDeploymentImageEndpoint.enabled
    updateDeploymentImageEndpoint:
      enabled: false

    # deployments.enableUpdateDeploymentImageEndpointDockerValidation → deployments.deploymentImagesRegistry.updateDeploymentImageEndpointDockerValidation.enabled
    updateDeploymentImageEndpointDockerValidation:
      enabled: false

    # deployments.serviceAccountAnnotationKey → deployments.deploymentImagesRegistry.serviceAccountAnnotationKey
    # AWS - eks.amazonaws.com/role-arn, GCP - iam.gke.io/gcp-service-account
    serviceAccountAnnotationKey: ~

  # ========================================
  # METRICS & REPORTING
  # ========================================
  metricsReporting:
    # shows grafana in ui flag is set in config map in astronomer/astronomer
    # deployments.grafanaUIEnabled → deployments.metricsReporting.grafana.enabled
    grafana:
      enabled: true

    # deployments.taskUsageReport → deployments.metricsReporting.taskUsageMetrics
    taskUsageMetrics:
      enabled: false
      reportNumberOfDays: 90

    # deployments.pagination → deployments.metricsReporting.pagination
    pagination:
      workspaceUsers:
        maxTake: 101
      workspaceTasks:
        maxTake: 101
      deploymentUsers:
        maxTake: 101
      workspace:
        maxTake: 101
      system:
        maxTake: 101
      taskUsage:
        maxTake: 101
      deployRevision:
        maxTake: 101
      cluster:
        maxTake: 101

  # ========================================
  # DEPLOYMENT MODE
  # ========================================
  mode:
    helm:
      enabled: true
    operator:
      enabled: false
      scheduler:
        mysql:
          startupProbe:
            exec:
              command:
              - sh
              - -c
              - |
                CONNECTION_CHECK_MAX_COUNT=0 AIRFLOW__LOGGING__LOGGING_LEVEL=ERROR exec /entrypoint \
                airflow jobs check --job-type SchedulerJob --local
            failureThreshold: 6
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 20
          livenessProbe:
            exec:
              command:
              - sh
              - -c
              - |
                CONNECTION_CHECK_MAX_COUNT=0 AIRFLOW__LOGGING__LOGGING_LEVEL=ERROR exec /entrypoint \
                airflow jobs check --job-type SchedulerJob --local
            failureThreshold: 5
            initialDelaySeconds: 10
            periodSeconds: 60
            successThreshold: 1
            timeoutSeconds: 30
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - |
                CONNECTION_CHECK_MAX_COUNT=0 AIRFLOW__LOGGING__LOGGING_LEVEL=ERROR exec /entrypoint \
                airflow jobs check --job-type SchedulerJob --local
            failureThreshold: 5
            initialDelaySeconds: 10
            periodSeconds: 60
            successThreshold: 1
            timeoutSeconds: 30
      triggerer:
        mysql:
          livenessProbe:
            exec:
              command:
              - sh
              - -c
              - |
                CONNECTION_CHECK_MAX_COUNT=0 AIRFLOW__LOGGING__LOGGING_LEVEL=ERROR exec /entrypoint airflow jobs check --job-type TriggererJob --local
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - |
                CONNECTION_CHECK_MAX_COUNT=0 AIRFLOW__LOGGING__LOGGING_LEVEL=ERROR exec /entrypoint airflow jobs check --job-type TriggererJob --local
            failureThreshold: 5
            initialDelaySeconds: 10
            periodSeconds: 60
            successThreshold: 1
            timeoutSeconds: 30

  # ========================================
  # OPERATIONAL CONFIGURATION (NON-FEATURES)
  # ========================================
  # These are operational parameters, validation rules, and config values
  # that are NOT toggleable features. They should remain at platform/cluster
  # level and not be overridable per-workspace or per-deployment.

  # ========================================
  # HELM CONFIGURATION
  # ========================================
  # These are static configs that get merged directly into the values
  # passed to helm for each deployment.
  helm:
    # Define default sslmode
    sslmode: disable
    # Enable networkpolicies with namespace selector
    networkNSLabels: false

    # Default runtime images
    runtimeImages:
      airflow:
        repository: quay.io/astronomer/astro-runtime
      flower:
        repository: quay.io/astronomer/astro-runtime
    runtimeImagesV3:
      airflow:
        repository: astrocrpublic.azurecr.io/runtime
      flower:
        repository: astrocrpublic.azurecr.io/runtime

    airflow:
      # Elasticsearch configuration for deployments.
      # Airflow clients access Elasticsearch differently.
      # Houston has full access, while the deployments connect
      # via NGINX for auth.
      elasticsearch:
        enabled: false
        connection:
          host: localhost
          port: 9200

      # Set default for debian image, which is the now the default for new
      # deployments. On image push, this will be read from (and validated) from
      # the labels in the docker image.
      uid: 50000
      gid: 50000

      # If enabled, deploy ServiceAccounts / Roles / RoleBindings
      # for components that require kubernetes apiserver access.
      rbac:
        create: true
      networkPolicies:
        # Enabled network polices to restrict the way pods can communicate.
        enabled: false
      pgbouncer:
        # Adds a pgbouncer service between the airflow pods (scheduler / webserver/ workers),
        # and the backend database.
        enabled: true
        metricsExporterSidecar:
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 100m
              memory: 384Mi
      # Allow scheduler/workers to launch pods by default. This is required for
      # the KubernetesPodOperator and KubernetesExecutor. This is what signals to apply the
      # required RoleBindings.
      allowPodLaunching: true
      scheduler:
        logGroomerSidecar:
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 100m
              memory: 384Mi
      triggerer:
        logGroomerSidecar:
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 100m
              memory: 384Mi
      workers:
        logGroomerSidecar:
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 100m
              memory: 384Mi
      dagProcessor:
        logGroomerSidecar:
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 100m
              memory: 384Mi

    ingress:
      # Attach an airflow deployment to the system level ingress controller.
      enabled: true
      extraIngressAnnotations: {}

  mockWebhook:
    krb:
      enabled: true
      realm: RDA
    enabled: false
    host: ~
    port: ~
    database: ~
    shouldCreateDb: true
    metadataConnection: ~
    resultBackendConnection: ~
    extraEnvs: []
    podLabels: {}

airgapped:
  enabled: false
updateAirflowCheck:
  enabled: true
updateRuntimeCheck:
  enabled: true
sslVerification:
  enabled: true
autoCompleteForSensitiveFields:
  enabled: true
logUsername:
  enabled: false
maxDockerJwtExtraDeployments: 50